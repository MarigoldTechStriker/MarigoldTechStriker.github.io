<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ever Upwards! - SHSAT Prep</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
    }

    /* Header / Hero Section */
    header {
      background-color: #4A4A4A; /* Gray background */
      color: #ffffff; /* White text */
      padding: 16px 20px 40px 20px;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .login-btn {
      background-color: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }

    .login-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .hero-title {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 1.4rem;
      font-weight: normal;
      margin-bottom: 24px;
    }

    .hero-cta {
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* Main Container */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* Navigation Buttons Bar */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      flex-wrap: wrap; /* Allows buttons to wrap cleanly on small phones */
    }

    .nav-btn {
      background-color: #007BFF; /* Blue buttons */
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #0056b3;
    }

    /* Section Panels */
    .panel {
      border: 2px solid #E0E0E0;
      background-color: #FAFAFA;
      border-radius: 16px; /* Rounded corners */
      padding: 30px;
      margin-bottom: 30px;
    }

    .panel-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    /* Subscriptions Grid */
    .pricing-grid {
      display: flex;
      gap: 20px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .price-card {
      background-color: #ffffff;
      border: 1px solid #CCCCCC;
      border-radius: 12px; /* Inner panels, rounded corners */
      padding: 24px;
      width: 100%;
      max-width: 180px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .price-amount {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-placeholder {
      font-size: 0.85rem;
      color: #666666;
    }

    /* Reviews Grid */
    .reviews-grid {
      display: flex;
      gap: 15px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .review-card {
      background-color: #ffffff;
      border: 1px solid #CCCCCC;
      border-radius: 8px;
      padding: 15px;
      flex: 1 1 140px;
      text-align: center;
      color: #666666;
      font-size: 0.9rem;
    }

    /* Resources List */
    .resource-list {
      list-style-type: disc;
      padding-left: 25px;
    }

    .resource-list li {
      margin-bottom: 10px;
    }

    .resource-link {
      color: #007BFF;
      text-decoration: underline;
      cursor: pointer;
    }

    .resource-link:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="top-bar">
      <button class="login-btn" onclick="handleLogin()">
        <span>👤</span> Login
      </button>
    </div>
    <h1 class="hero-title">Ever Upwards!</h1>
    <h2 class="hero-subtitle">Your success is our Mission</h2>
    <p class="hero-cta">Get Started Today!</p>
  </header>

  <!-- Main Content Area -->
  <main class="container">

    <!-- Navigation Buttons (Resources -> Reviews -> Subscriptions) -->
    <nav class="nav-bar">
      <button class="nav-btn" onclick="scrollToSection('resources')">Resources</button>
      <button class="nav-btn" onclick="scrollToSection('reviews')">Reviews</button>
      <button class="nav-btn" onclick="scrollToSection('subscriptions')">Subscriptions</button>
    </nav>

    <!-- Resources Section -->
    <section id="resources" class="panel">
      <h3 class="panel-title">Resources</h3>
      <ul class="resource-list">
        <li><a href="#" class="resource-link">Hyperlink placeholder 1</a></li>
        <li><a href="#" class="resource-link">Hyperlink placeholder 2</a></li>
      </ul>
    </section>

    <!-- Reviews Section -->
    <section id="reviews" class="panel">
      <h3 class="panel-title">Reviews</h3>
      <div class="reviews-grid">
        <div class="review-card">Placeholder text</div>
        <div class="review-card">Placeholder text</div>
        <div class="review-card">Placeholder text</div>
        <div class="review-card">Placeholder text</div>
      </div>
    </section>

    <!-- Subscriptions Section -->
    <section id="subscriptions" class="panel">
      <h3 class="panel-title">Subscriptions</h3>
      <div class="pricing-grid">
          <div class="price-card">
          <div class="price-amount">$400</div>
          <div class="price-placeholder">(yearly + 2 months free)</div>
        </div>
        <div class="price-card">
          <div class="price-amount">$30</div>
          <div class="price-placeholder">(monthly)</div>
        </div>
        <div class="price-card">
          <div class="price-amount">$40</div>
          <div class="price-placeholder">(monthly)</div>
        </div>
      </div>
    </section>

  </main>

  <!-- JavaScript Logic -->
  <script>
    function scrollToSection(sectionId) {
      const section = document.getElementById(sectionId);
      if (section) {
        section.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function handleLogin() {
      alert('Login clicked! Connect this to your Supabase auth login.');
    }
  </script>

</body>
</html>
