<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section Selection</title>
  <style>
    /* Basic Page Setup */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Container Card */
    .selection-card {
      background-color: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      color: #1a202c;
    }

    /* Selection List */
    .section-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 24px 0;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .option:hover {
      background-color: #f8fafc;
    }

    .option input {
      margin-right: 12px;
    }

    /* -------------------------------------------------- */
    /* CONTINUE BUTTON STYLES (NO GLOW / NO BOX-SHADOW)   */
    /* -------------------------------------------------- */
    .btn-continue {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;

      /* Explicitly removing any glow, shadows, or filters */
      box-shadow: none !important;
      text-shadow: none !important;
      filter: none !important;
      outline: none;

      /* Smooth color change on hover without adding a glow */
      transition: background-color 0.2s ease;
    }

    /* Solid color change on hover (No glowing halo) */
    .btn-continue:hover {
      background-color: #1d4ed8;
      box-shadow: none !important;
      filter: none !important;
    }

    /* Solid color change on active click */
    .btn-continue:active {
      background-color: #1e40af;
      box-shadow: none !important;
    }

    /* Clean focus border for accessibility instead of a glow */
    .btn-continue:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

  <div class="selection-card">
    <h2>Select a Section</h2>
    <p>Choose the section you wish to proceed with:</p>

    <div class="section-options">
      <label class="option">
        <input type="radio" name="section" value="1" checked>
        Section 1: Introduction
      </label>
      <label class="option">
        <input type="radio" name="section" value="2">
        Section 2: Core Module
      </label>
      <label class="option">
        <input type="radio" name="section" value="3">
        Section 3: Advanced Topics
      </label>
    </div>

    <!-- Continue Button -->
    <button type="button" class="btn-continue">Continue</button>
  </div>

</body>
</html>
